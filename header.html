<!-- Hala Live Agency - Header Component (header.html) -->
<header class="site-header" id="site-header">
  <div class="nav-container">
    <a href="#hero" class="nav-brand" aria-label="Hala Live Agency Home">
      <img src="Asset/logo.webp" alt="Hala Live Agency Logo" class="nav-logo" width="44" height="44" loading="eager">
      <span class="nav-brand-text">Hala <span class="nav-brand-highlight">Agency</span></span>
    </a>

    <nav aria-label="Main Navigation">
      <ul class="nav-menu-desktop">
        <li><a href="#hero" class="nav-link active">Home</a></li>
        <li><a href="#tutorial" class="nav-link">Tutorial</a></li>
        <li><a href="#income" class="nav-link">Earnings</a></li>
        <li><a href="#host-vs-agent" class="nav-link">Host</a></li>
        <li><a href="#faqs" class="nav-link">FAQs</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <a href="https://web.hehala.com/h5/index.html#/share_agentPage?uid=2088653" target="_blank" rel="noopener noreferrer" class="btn-primary nav-cta-btn">
        <span>Become Agent</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <button type="button" class="nav-toggle-btn" id="nav-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg class="icon-bars" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true">
    <ul class="mobile-nav-links">
      <li><a href="#hero" class="mobile-nav-link active">Home</a></li>
      <li><a href="#tutorial" class="mobile-nav-link">Tutorial</a></li>
      <li><a href="#income" class="mobile-nav-link">Earnings</a></li>
      <li><a href="#host-vs-agent" class="mobile-nav-link">Host</a></li>
      <li><a href="#faqs" class="mobile-nav-link">FAQs</a></li>
    </ul>

    <a href="https://web.hehala.com/h5/index.html#/share_agentPage?uid=2088653" target="_blank" rel="noopener noreferrer" class="btn-primary mobile-drawer-cta">
      <span>Become Agent</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

  <script>
    (function () {
      const header = document.getElementById('site-header');
      const toggleBtn = document.getElementById('nav-toggle-btn');
      const drawer = document.getElementById('mobile-nav-drawer');
      const mobileLinks = document.querySelectorAll('.mobile-nav-link');
      const navLinks = document.querySelectorAll('.nav-link');

      // Scroll background glass shadow update
      window.addEventListener('scroll', function () {
        if (window.scrollY > 20) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      });

      // Mobile Menu Toggle
      if (toggleBtn && drawer) {
        toggleBtn.addEventListener('click', function () {
          const isOpen = drawer.classList.toggle('open');
          toggleBtn.classList.toggle('active', isOpen);
          toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          drawer.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
          document.body.style.overflow = isOpen ? 'hidden' : '';
        });

        // Close on link click
        mobileLinks.forEach(function (link) {
          link.addEventListener('click', function () {
            drawer.classList.remove('open');
            toggleBtn.classList.remove('active');
            toggleBtn.setAttribute('aria-expanded', 'false');
            drawer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
          });
        });
      }

      // Smooth Scroll and Active link update
      const sections = document.querySelectorAll('section[id]');
      window.addEventListener('scroll', function () {
        let current = '';
        const scrollPos = window.pageYOffset + 120;

        sections.forEach(function (section) {
          const sectionTop = section.offsetTop;
          const sectionHeight = section.offsetHeight;
          if (scrollPos >= sectionTop && scrollPos < sectionTop + sectionHeight) {
            current = section.getAttribute('id');
          }
        });

        navLinks.forEach(function (link) {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current) {
            link.classList.add('active');
          }
        });

        mobileLinks.forEach(function (link) {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current) {
            link.classList.add('active');
          }
        });
      });
    })();
  </script>
</header>
